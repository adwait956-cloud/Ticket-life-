<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="50%" stop-color="#141824" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="champagneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#262f45" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Stylized Compass Star & Ticket Life Geometric Emblem -->
  <g filter="url(#glow)">
    <!-- North Arrow Point -->
    <path d="M 256 96 L 286 230 L 256 256 L 226 230 Z" fill="url(#goldGrad)" />
    <!-- South Arrow Point -->
    <path d="M 256 416 L 286 282 L 256 256 L 226 282 Z" fill="#475569" opacity="0.85" />
    <!-- East Arrow Point -->
    <path d="M 416 256 L 282 226 L 256 256 L 282 286 Z" fill="url(#goldGrad)" />
    <!-- West Arrow Point -->
    <path d="M 96 256 L 230 226 L 256 256 L 230 286 Z" fill="#475569" opacity="0.85" />

    <!-- Center Pivot Core -->
    <circle cx="256" cy="256" r="44" fill="#080b11" stroke="url(#goldGrad)" stroke-width="6" />
    <circle cx="256" cy="256" r="22" fill="url(#champagneGrad)" />
  </g>

  <!-- Transportation Dots / Transit Waypoints -->
  <circle cx="256" cy="144" r="7" fill="#ffffff" />
  <circle cx="368" cy="256" r="7" fill="#ffffff" />
  <circle cx="256" cy="368" r="7" fill="#f59e0b" />
  <circle cx="144" cy="256" r="7" fill="#f59e0b" />

  <!-- Clean Minimalist Monogram Cutout -->
  <text x="256" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="6" fill="#fef3c7" text-anchor="middle">
    TICKET LIFE
  </text>
</svg>
